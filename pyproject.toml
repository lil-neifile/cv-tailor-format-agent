[project]
name = "cv-tailor-format-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.3.16",
    "langchain-litellm>=0.7.0",
    "langgraph>=1.2.11",
    "litellm>=1.97.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "playwright>=1.49.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.62.0",
    "streamlit-extras>=1.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s -q"
